apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '"trace":"([a-f0-9]+)"'
          url: "$${__value.raw}"
          urlDisplayLabel: View Trace
        - name: TraceID_alt
          datasourceUid: tempo
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          url: "$${__value.raw}"
          urlDisplayLabel: View Trace

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-15m"
        spanEndTimeShift: "15m"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{job="mindray"} |~ "${__trace.traceId}"'
      serviceMap:
        datasourceUid: tempo
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
