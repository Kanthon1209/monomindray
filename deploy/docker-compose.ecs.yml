# ECS / production compose — build from precompiled artifacts (no Go/npm on server).
# From repo root on ECS:
#   docker compose -f deploy/docker-compose.ecs.yml --env-file deploy/.env up -d --build

services:
  postgres:
    image: postgres:17-alpine
    container_name: mindray-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mindray}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindray_secret}
      POSTGRES_DB: ${DB_NAME:-mindray}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../apps/backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mindray} -d ${DB_NAME:-mindray}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mindray

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: mindray-api:local
    container_name: mindray-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started
    networks:
      - mindray

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: mindray-web:local
    container_name: mindray-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    networks:
      - mindray

  caddy:
    image: caddy:2.10-alpine
    container_name: mindray-caddy
    restart: unless-stopped
    depends_on:
      - api
      - web
      - grafana
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CANONICAL_HOST: ${CANONICAL_HOST:-localhost}
      # When SITE_ADDRESS is a domain, set to public IP so http://IP redirects to https://domain
      REDIRECT_IP: ${REDIRECT_IP:-127.0.0.2}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mindray

  # Ops UI — http://<host>/pgadmin  (also :5050). Set strong PGADMIN_PASSWORD.
  # ERD: 右键数据库 → ERD For Database
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: mindray-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mindray.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-mindray_pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local','mindray']"
      # Required when served under http://host/pgadmin via Caddy
      SCRIPT_NAME: /pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/tmp/pgpass:ro
    networks:
      - mindray

  # Observability — Loki logs + Tempo traces via /grafana. Keep memory tight.
  loki:
    image: grafana/loki:3.4.2
    container_name: mindray-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    mem_limit: 320m
    networks:
      - mindray

  tempo:
    image: grafana/tempo:2.7.1
    container_name: mindray-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
    mem_limit: 256m
    networks:
      - mindray

  alloy:
    image: grafana/alloy:v1.8.1
    container_name: mindray-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - tempo
    mem_limit: 192m
    networks:
      - mindray

  grafana:
    image: grafana/grafana:11.5.2
    container_name: mindray-grafana
    restart: unless-stopped
    depends_on:
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-mindray_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://www.mindcollect.xyz/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 256m
    networks:
      - mindray

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  pgadmin_data:
  loki_data:
  alloy_data:
  grafana_data:
  tempo_data:

networks:
  mindray:
    driver: bridge
