# Local development: builds from source. Do not use on the weak ECS host.
# Usage (repo root):
#   docker compose -f deploy/docker-compose.dev.yml --env-file deploy/.env up --build

services:
  postgres:
    image: postgres:17-alpine
    container_name: mindray-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mindray}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindray_secret}
      POSTGRES_DB: ${DB_NAME:-mindray}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ../apps/backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mindray} -d ${DB_NAME:-mindray}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mindray

  api:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: mindray-api-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-mindray_jwt_secret_change_me}
    ports:
      - "8080:8080"
    networks:
      - mindray

  web:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: mindray-web-dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "3000:3000"
    networks:
      - mindray

  caddy:
    image: caddy:2-alpine
    container_name: mindray-caddy-dev
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    networks:
      - mindray

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: mindray-pgadmin-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mindray.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-mindray_pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/tmp/pgpass:ro
    networks:
      - mindray

volumes:
  postgres_data_dev:
  pgadmin_data_dev:

networks:
  mindray:
    driver: bridge
